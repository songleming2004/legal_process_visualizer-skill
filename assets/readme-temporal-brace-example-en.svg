<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Typographic braces used to compare legal and factual periods</title>
  <desc id="desc">A fictional timeline compares an original limitation period, a continuous factual obstacle, and the legally relevant overlap using three editable typographic braces.</desc>
  <defs>
    <style>
      .page{fill:#F7F6F2}.panel{fill:#FCFCFA;stroke:#C5CBD1;stroke-width:1.5}.title{font:600 30px 'Inter','Helvetica Neue',Arial,sans-serif;fill:#1F2933}.subtitle{font:400 15px 'Inter','Helvetica Neue',Arial,sans-serif;fill:#52606D}.date{font:600 13px 'IBM Plex Mono','SFMono-Regular',monospace;fill:#34414C}.event{font:500 14px 'Inter','Helvetica Neue',Arial,sans-serif;fill:#37474F}.heading{font:600 16px 'Inter','Helvetica Neue',Arial,sans-serif;fill:#1F2933}.source{font:500 12px 'Inter','Helvetica Neue',Arial,sans-serif;fill:#52606D}.axis{stroke:#55606D;stroke-width:2}.tick{stroke:#55606D;stroke-width:2}.guide{stroke:#AAB4BD;stroke-width:1.5;stroke-dasharray:6 6}.legal{fill:#6783A2}.factual{fill:#86729F}.overlap{fill:#668B78}.legalCard{fill:#E7EEF6;stroke:#6783A2;stroke-width:1.5}.factualCard{fill:#EEE9F5;stroke:#86729F;stroke-width:1.5}.overlapCard{fill:#E5F0EA;stroke:#668B78;stroke-width:1.5}
    </style>
  </defs>
  <rect class="page" width="1400" height="820"/>
  <rect class="panel" x="55" y="45" width="1290" height="750" rx="14"/>
  <text class="title" x="700" y="92" text-anchor="middle">When a brace is useful for a period</text>
  <text class="subtitle" x="700" y="122" text-anchor="middle">Separate endpoint pairs make a legal window, a factual state, and their relevant overlap auditable</text>

