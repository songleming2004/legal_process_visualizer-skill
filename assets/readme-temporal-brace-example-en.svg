    <line class="tick" x1="220" y1="231" x2="220" y2="249"/>
    <line class="tick" x1="460" y1="231" x2="460" y2="249"/>
    <line class="tick" x1="1030" y1="231" x2="1030" y2="249"/>
    <line class="tick" x1="1210" y1="231" x2="1210" y2="249"/>
